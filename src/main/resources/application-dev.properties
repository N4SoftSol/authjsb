server.ssl.key-alias=subrestapi

#Auth
spring.security.oauth2.authorizationserver.issuer=http://localhost:9000
logging.level.org.springframework.security=DEBUG
#LDAP
spring.ldap.urls=ldaps://ldap.n4softsol.com:636
spring.ldap.base=dc=n4softsol,dc=com
spring.ldap.username=cn=svc_apex_edug,ou=ServiceAccounts,ou=edug,dc=n4softsol,dc=com
spring.ldap.password=${LDAP_BIND_PASSWORD}

# OracleDB connection settings
spring.datasource.url=jdbc:oracle:thin:@192.168.1.153:1521/APEXPRD
spring.datasource.username=DEV_JSB_APP_USER
spring.datasource.password=${AUTHJSB_DB_PASSWORD}

# UCP settings
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.initial-pool-size=5
spring.datasource.oracleucp.min-pool-size=5
spring.datasource.oracleucp.max-pool-size=10


#LDAP Trace
