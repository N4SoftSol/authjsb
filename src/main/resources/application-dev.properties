test.profile=DEV_PROFILE_DESKTOP
server.port=9001
server.ssl.enabled=false
server.ssl.key-store=classpath:/app/keys/subrestapi-ssl.p12
server.ssl.key-store-password=${JWT_KEYSTORE_PASSWORD}
