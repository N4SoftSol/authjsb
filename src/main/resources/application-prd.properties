test.profile=PRD_DOCKER_DEPLOYED
server.port=9000
server.ssl.enabled=false
server.ssl.key-store=/app/keys/subrestapi-ssl.p12
server.ssl.key-store-password=${JWT_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=subrestapi

spring.security.oauth2.authorizationserver.issuer=https://authjsb.restapi.n4softsol.com
#logging.level.org.springframework.security=DEBUG
#LDAP
spring.ldap.urls=ldaps://ldap.n4softsol.com:636
spring.ldap.base=dc=n4softsol,dc=com
spring.ldap.username=cn=svc_apex_edug,ou=ServiceAccounts,ou=edug,dc=n4softsol,dc=com
spring.ldap.password=${LDAP_BIND_PASSWORD}

# OracleDB connection settings
spring.datasource.url=jdbc:oracle:thin:@192.168.1.153:1521/APEXPRD
spring.datasource.username=DEV_JSB_APP_USER
spring.datasource.password=${AUTHJSB_DB_PASSWORD}


# UCP settings
spring.datasource.type=oracle.ucp.jdbc.PoolDataSource
spring.datasource.oracleucp.connection-factory-class-name=oracle.jdbc.pool.OracleDataSource
spring.datasource.oracleucp.initial-pool-size=5
spring.datasource.oracleucp.min-pool-size=5
spring.datasource.oracleucp.max-pool-size=10


#LDAP Trace
logging.level.org.springframework.security.ldap.userdetails=TRACE
logging.level.org.springframework.ldap=TRACE
logging.level.org.springframework.security.ldap=TRACE
logging.level.com.sun.jndi.ldap=TRACE

#
jwt.keystore.location=/app/keys/authserver-keystore.p12
jwt.key.alias=authserver
jwt.keystore.password=${JWT_KEYSTORE_PASSWORD}
jwt.key.password=${JWT_KEY_PASSWORD}
#
jwt.access-token-seconds=900
jwt.issuer=https://authjsb.restapi.n4softsol.com
jwt.refresh-token-days=1
#logging.level.org.springframework.web=DEBUG
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
