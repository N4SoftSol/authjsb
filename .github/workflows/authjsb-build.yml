name: AuthJSB Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Verify Runner
        run: |
          hostname
          pwd

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Java
        run: |
          java -version
          mvn -version

      - name: Build Application
        run: |
          mvn clean package -DskipTests

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t naveenezone/authjsb:latest \
            -t naveenezone/authjsb:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push naveenezone/authjsb:latest
          docker push naveenezone/authjsb:${{ github.sha }}

      - name: Deploy
        run: |
          cd /app/build/n4ss-authjsb
          docker compose pull
          docker compose up -d
